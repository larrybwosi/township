name: Release and Publish Docker Images

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Version and Tag
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.check-changesets.outputs.has_changesets }}
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
      api_version: ${{ steps.version-packages.outputs.api_version }}
      web_version: ${{ steps.version-packages.outputs.web_version }}
      rental_version: ${{ steps.version-packages.outputs.rental_version }}
      marketplace_version: ${{ steps.version-packages.outputs.marketplace_version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/database generate

      - name: Check for changesets
        id: check-changesets
        run: |
          CHANGESETS_COUNT=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" | wc -l)
          echo "Found $CHANGESETS_COUNT changesets"
          if [ "$CHANGESETS_COUNT" -gt 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Set lower case owner name
        id: owner
        if: steps.check-changesets.outputs.has_changesets == 'true'
        run: |
          OWNER_LC="${OWNER,,}"
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Version Packages, Commit and Tag
        id: version-packages
        if: steps.check-changesets.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Run changeset version to consume changesets and bump versions
          pnpm exec changeset version

          # Read new versions of api, web, rental and marketplace
          API_VERSION=$(node -p "require('./apps/api/package.json').version")
          WEB_VERSION=$(node -p "require('./apps/web/package.json').version")
          RENTAL_VERSION=$(node -p "require('./apps/rental/package.json').version")
          MARKETPLACE_VERSION=$(node -p "require('./apps/marketplace/package.json').version")

          echo "api_version=$API_VERSION" >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB_VERSION" >> "$GITHUB_OUTPUT"
          echo "rental_version=$RENTAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "marketplace_version=$MARKETPLACE_VERSION" >> "$GITHUB_OUTPUT"

          # Commit and push version changes to main (preventing CI loop with [skip ci])
          git add .
          git commit -m "chore: release v$API_VERSION [skip ci]" || true
          git push origin main

          # Create and push unified git tag only if it does not exist
          if ! git rev-parse "v$API_VERSION" >/dev/null 2>&1; then
            echo "Creating and pushing tag v$API_VERSION"
            git tag "v$API_VERSION"
            git push origin "v$API_VERSION"
          else
            echo "Tag v$API_VERSION already exists, skipping tag creation"
          fi

      - name: Create GitHub Release
        if: steps.check-changesets.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_VERSION="${{ steps.version-packages.outputs.api_version }}"
          if ! gh release view "v$API_VERSION" >/dev/null 2>&1; then
            echo "Creating release for v$API_VERSION"
            gh release create "v$API_VERSION" --title "v$API_VERSION" --notes "Release v$API_VERSION" || true
          else
            echo "Release v$API_VERSION already exists, skipping"
          fi

  build:
    name: Build and Push (${{ matrix.app }})
    needs: version
    if: needs.version.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            version: ${{ needs.version.outputs.api_version }}
            build_args: ""
          - app: web
            dockerfile: apps/web/Dockerfile
            version: ${{ needs.version.outputs.web_version }}
            build_args: "NEXT_PUBLIC_API_URL=http://localhost:3001"
          - app: rental
            dockerfile: apps/rental/Dockerfile
            version: ${{ needs.version.outputs.rental_version }}
            build_args: "NEXT_PUBLIC_API_URL=http://localhost:3001"
          - app: marketplace
            dockerfile: apps/marketplace/Dockerfile
            version: ${{ needs.version.outputs.marketplace_version }}
            build_args: "NEXT_PUBLIC_API_URL=http://localhost:3001"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Build from the tag the version job just pushed, so the Docker
          # build context matches the versioned commit.
          ref: v${{ needs.version.outputs.api_version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }} Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ needs.version.outputs.owner_lc }}/${{ matrix.app }}:latest
            ghcr.io/${{ needs.version.outputs.owner_lc }}/${{ matrix.app }}:${{ matrix.version }}
