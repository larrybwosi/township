name: Release and Publish Docker Images

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/database generate

      - name: Check for changesets
        id: check-changesets
        run: |
          CHANGESETS_COUNT=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" | wc -l)
          echo "Found $CHANGESETS_COUNT changesets"
          if [ "$CHANGESETS_COUNT" -gt 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Set lower case owner name
        if: steps.check-changesets.outputs.has_changesets == 'true'
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Version Packages, Commit and Tag
        id: version-packages
        if: steps.check-changesets.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Run changeset version to consume changesets and bump versions
          pnpm exec changeset version

          # Read new versions of api and web
          API_VERSION=$(node -p "require('./apps/api/package.json').version")
          WEB_VERSION=$(node -p "require('./apps/web/package.json').version")

          echo "API_VERSION=$API_VERSION" >> $GITHUB_ENV
          echo "WEB_VERSION=$WEB_VERSION" >> $GITHUB_ENV

          # Commit and push version changes to main (preventing CI loop with [skip ci])
          git add .
          git commit -m "chore: release v$API_VERSION [skip ci]" || true
          git push origin main

          # Create and push unified git tag only if it does not exist
          if ! git rev-parse "v$API_VERSION" >/dev/null 2>&1; then
            echo "Creating and pushing tag v$API_VERSION"
            git tag "v$API_VERSION"
            git push origin "v$API_VERSION"
          else
            echo "Tag v$API_VERSION already exists, skipping tag creation"
          fi

      - name: Log in to GHCR
        if: steps.check-changesets.outputs.has_changesets == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api Docker image
        if: steps.check-changesets.outputs.has_changesets == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/api:latest
            ghcr.io/${{ env.OWNER_LC }}/api:${{ env.API_VERSION }}

      - name: Build and push web Docker image
        if: steps.check-changesets.outputs.has_changesets == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/web:latest
            ghcr.io/${{ env.OWNER_LC }}/web:${{ env.WEB_VERSION }}

      - name: Create GitHub Releases
        if: steps.check-changesets.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "v$API_VERSION" >/dev/null 2>&1; then
            echo "Creating release for v$API_VERSION"
            gh release create "v$API_VERSION" --title "v$API_VERSION" --notes "Release v$API_VERSION" || true
          else
            echo "Release v$API_VERSION already exists, skipping"
          fi
