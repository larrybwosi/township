services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: township
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d township"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: "postgresql://user:password@postgres:5432/township?schema=public"
      JWT_SECRET: "mySuperSecretKey"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
      PORT: "3000"
    depends_on:
      - api

  rental:
    build:
      context: .
      dockerfile: apps/rental/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
      PORT: "3002"
    depends_on:
      - api

  marketplace:
    build:
      context: .
      dockerfile: apps/marketplace/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
      PORT: "3003"
    depends_on:
      - api

volumes:
  postgres_data:
